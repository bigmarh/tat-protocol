name: TAT Protocol Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # 22 is the first line with node:sqlite, which the ledger tests use.
        node-version: [22, 24]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # pnpm must exist before setup-node can use its store as the cache; the
    # version comes from package.json's packageManager field.
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    # The whole suite: unit, integration, conformance and package tests.
    - name: Run tests
      run: pnpm test
